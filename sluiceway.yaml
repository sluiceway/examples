# yaml-language-server: $schema=https://raw.githubusercontent.com/sluiceway/sluiceway/main/schema/sluiceway.schema.json
#
# Sluiceway's settings for this repo. Every key is optional: without this file
# Sluiceway still finds every stack and gives each one a row. The whole list
# of keys is in https://github.com/sluiceway/sluiceway/blob/main/docs/configuration.md
#
# One dashboard for the stacks of both tools in this repo, Pulumi and
# OpenTofu. Sluiceway finds the Pulumi stacks from their files. It finds no
# OpenTofu stack on its own: each one is declared under stacks below, with
# tool: opentofu. Terraform is not supported by the action yet.

dashboard:
  # The title the dashboard issue gets when Sluiceway first creates it.
  title: Sluiceway examples

  # Off by default, and on here only because every value in this repo is
  # fake. A changed property at one of these paths shows its old and new
  # value on the row, the preview page and the summary, and a tick then
  # approves that value. In a real repo, list only paths whose values you
  # would put in a public issue: the tool does not know which of your values
  # are secret unless they are marked so. Read
  # https://github.com/sluiceway/sluiceway/blob/main/docs/configuration.md#dashboardshowvalues
  showValues:
    - environment.GREETING # the greeting of pulumi/plain/greeting
    - environment.VERSION  # the version of pulumi/plain/release

# Stacks that get no row. An entry with a reason lists the stack with it in a
# fold under In sync, so the exclusion stays in sight.
ignore:
  - glob: "**/*:scratch"
    reason: A scratch stack for trying a change by hand. It is never deployed from here.

scan:
  # Files that no program reads. A push that changes only these previews no
  # stack. A changed file that no stack claims makes a full scan instead,
  # which is the safe side. This block is the one the check suggested.
  unrelated:
    - "**/*.md"
    - "docs/**"
    - ".github/**"
    - "LICENSE*"
    - "**/.gitignore"
  # Kept off this list on purpose: package.json, package-lock.json and .nvmrc
  # at the root. Every TypeScript program in pulumi/monorepo runs on them, and
  # no stack claims them, so a change to one of them previews every stack.

  # Off by default, and on here only because every value in this repo is
  # fake. Every pending stack's group in the scan's job log then holds the
  # tool's own diff, values included. In a public repo anyone can read the
  # job log, and only values the tool marks secret are masked there. Read
  # https://github.com/sluiceway/sluiceway/blob/main/docs/security.md#the-tools-own-diff-in-the-job-log
  logDiff: true

# Off by default. On here so that the dashboard can show drift: every scan
# that the daily schedule or "Run workflow" starts also checks each Pulumi
# stack against what is real, with `pulumi refresh --preview-only`, which
# changes nothing. pulumi/states/drift writes a file on the runner, and the
# next runner does not have it, so the check always finds it gone. OpenTofu
# stacks are not checked yet. Read
# https://github.com/sluiceway/sluiceway/blob/main/docs/configuration.md#driftenabled
drift:
  enabled: true

# Settings per stack. An entry without tool adds to a stack that discovery
# found. An entry with tool: opentofu declares a stack, because files alone
# cannot say which directory is a root module or which workspaces it has.
stacks:
  # opentofu/site: one root module in two workspaces, so two stacks, with the
  # ids opentofu/site:dev and opentofu/site:prod. The name is only the part of
  # the id after the colon and selects nothing: the workspace does, and
  # Sluiceway sets TF_WORKSPACE to it for every command of the stack. Each
  # workspace has its own var file, passed with -var-file. A var file inside
  # the stack's directory is claimed by the stack, so a change to dev.tfvars
  # previews both stacks of the directory and nothing else.
  - path: opentofu/site
    name: dev
    tool: opentofu
    options:
      workspace: dev
      varFiles: [dev.tfvars]
  - path: opentofu/site
    name: prod
    tool: opentofu
    options:
      workspace: prod
      varFiles: [prod.tfvars]
  # opentofu/notes: a root module in .tofu files, in the default workspace,
  # with no var file. Without a name, its id is the path alone,
  # opentofu/notes.
  - path: opentofu/notes
    tool: opentofu

  # The two TypeScript apps of pulumi/monorepo import the shared package
  # packages/naming, which lies outside their directories. A stack claims the
  # files in its own directory and the ones its inputs name, so each app names
  # the package here. A push that changes only the package then previews the
  # three stacks of these two apps and nothing else.
  - path: pulumi/monorepo/apps/web
    inputs:
      - pulumi/monorepo/packages/naming/**
  - path: pulumi/monorepo/apps/api
    inputs:
      - pulumi/monorepo/packages/naming/**
  # web:prod depends on api:prod, as a web app that calls its API would. Here
  # the two programs share no value: the entry is there to show the order. A
  # tick on web:prod starts nothing while api:prod has a change that nobody
  # ticked, and a tick on web:prod while api:prod deploys waits until it went
  # out, then deploys in a later run.
  - path: pulumi/monorepo/apps/web
    name: prod
    dependsOn:
      - pulumi/monorepo/apps/api:prod
  # The program of pulumi/secret-manager reads what the job loads from the env
  # files in ci/secret-manager, so a change to one of them changes what the
  # program sees. Here only this stack reads them, so it claims them, and a
  # push that changes only an env file previews this stack and nothing else.
  # In a real repo where every stack runs on one env file, leave it unclaimed:
  # a change to it then previews every stack, which is the safe side.
  # The stand-in scripts and the file of fake values in .github/scripts stay
  # under scan.unrelated: in a real repo the values live in the secret
  # manager, and a push never changes them. A new value there reaches the
  # next scan, like any change made outside the repo.
  # pulumi/states/retire:prod deletes a resource, so only a named person may
  # tick it. The name is a placeholder that is not the owner of this repo, so
  # a tick by the owner is refused and gets a comment on the dashboard. A
  # list narrows: a person on it still needs write access.
  - path: pulumi/states/retire
    name: prod
    tickers:
      - example-release-manager
  - path: pulumi/secret-manager/webhook
    inputs:
      - ci/secret-manager/**
