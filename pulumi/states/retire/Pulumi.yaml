name: states-retire
runtime: yaml
description: >-
  A worker that is being retired. Its next deploy deletes the worker and
  replaces the name, which a longer name forces. It stays pending.
config:
  token:
    type: string
    secret: true
resources:
  name:
    type: random:RandomPet
    properties:
      # Was 2. A new length makes a new name, so the deploy replaces it.
      length: 3
      prefix: retire
    options:
      version: 4.21.2
  # The worker is gone from the program, so the next deploy deletes it.
