# The whole Sluiceway workflow of the action's README, with its four jobs, on
# hosted runners. Everything the tools need is set up in the steps before the
# Sluiceway step. The steps marked "Pulumi" are Pulumi's, the steps marked
# "OpenTofu" are OpenTofu's, for the stacks in opentofu/. The steps marked
# "Monorepo" install the npm workspaces at the repo root, for the TypeScript
# programs in pulumi/monorepo. The steps "Load the environment" load an env
# file of secret references, for pulumi/secret-manager, from a stand-in for a
# secret manager with fake values.
#
# Nothing here is a secret. The only token is the workflow's own GITHUB_TOKEN.
name: deploy-dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # the daily full scan is part of the design
  workflow_dispatch:
  issues:
    types: [edited]

# This block is everything Sluiceway can do in this repo.
permissions:
  contents: read
  issues: write
  deployments: write
  actions: write
  pull-requests: read
  checks: write

jobs:
  scan:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    concurrency: sluiceway-scan
    env:
      # Pulumi: the passphrase that encrypts the stack secrets. It is public on
      # purpose and protects nothing: every secret in this repo is fake. A real
      # repo keeps its passphrase in a secret, or uses a secrets provider.
      PULUMI_CONFIG_PASSPHRASE: sluiceway-examples
    steps:
      - uses: actions/checkout@v7

      # Monorepo: one install at the root for every TypeScript program and
      # shared package, not one per stack. It runs before the steps that set
      # up the state, so the install scripts of the dependencies never see
      # the backend. The passphrase on the job is public, so it may.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Pulumi: the CLI. Without a command this action only installs it.
      - uses: pulumi/actions@v7
        with:
          pulumi-version: ^3.229.0
      # Pulumi: the providers the programs use. The first run fills the cache.
      # The YAML programs name their providers in Pulumi.yaml, the TypeScript
      # ones in the lockfile, so the key covers both.
      - uses: actions/cache@v6
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pulumi/**/Pulumi.yaml', 'package-lock.json') }}

      # OpenTofu: the CLI, as the action's credentials page shows it. No
      # wrapper: Sluiceway reads what tofu itself prints.
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      # OpenTofu: the providers, downloaded once and shared by every init.
      # The first run fills the cache. The lock files name every provider.
      - name: Use a provider cache (OpenTofu)
        run: |
          mkdir -p "$RUNNER_TEMP/tofu-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tofu-plugins" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tofu-plugins
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('opentofu/**/.terraform.lock.hcl') }}

      # Stand-in for a real state backend (a bucket, Pulumi Cloud), not part
      # of a normal install. The state is kept between runs in the Actions
      # cache, one cache for both tools: Pulumi's file backend is a directory
      # on the runner, and OpenTofu's local backend writes terraform.tfstate
      # (the default workspace) or terraform.tfstate.d/<workspace>/ next to
      # each module in opentofu/. The scan takes the newest state that a
      # deploy saved and never saves one itself.
      - name: Use the file backend (stand-in)
        # The directory has to exist: a fresh cache restores none.
        run: |
          mkdir -p "$RUNNER_TEMP/pulumi-state"
          echo "PULUMI_BACKEND_URL=file://$RUNNER_TEMP/pulumi-state" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          # The same paths in every step: the cache finds an entry only when
          # the list is the same as when it was saved.
          path: |
            ${{ runner.temp }}/pulumi-state
            opentofu/**/terraform.tfstate
            opentofu/**/terraform.tfstate.d
          key: state-${{ github.run_id }}
          restore-keys: state-
      # Stand-in too: a fresh cache has no stacks, and a stack config file
      # with no stack in the backend is a red row. A real backend already has
      # every stack, so a normal install has no such step. OpenTofu needs no
      # such step: the local backend plans a workspace it does not hold as
      # all creates, and the first deploy makes it.
      - name: Create the missing stacks (stand-in)
        run: .github/scripts/create-missing-stacks.sh

      # Secret manager: the step of the action's secret-manager.yml. It runs
      # last before Sluiceway, so no earlier step sees what it loads. A real
      # repo installs the manager's CLI first, for example:
      #   - uses: 1password/install-cli-action@v4
      # and runs `op run` in place of the stand-in. This job loads the preview
      # file. In a real repo its references point into a vault that only the
      # scan's service account can read, with credentials that can only read.
      - name: Load the environment
        # Stand-in: fake-secret-run.sh resolves the fake:// references from a
        # committed file of fake values, and no token is needed. A real repo
        # sets the token of the scan's service account here, on this step only:
        #   OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PREVIEW_TOKEN }}
        # and leaves SECRET_REFERENCE at the script's default, op://.
        env:
          SECRET_REFERENCE: fake://
        run: .github/scripts/fake-secret-run.sh --env-file=ci/secret-manager/preview.env -- bash .github/scripts/export-env.sh ci/secret-manager/preview.env

      - uses: sluiceway/sluiceway@v0
        with:
          mode: scan

  resolve:
    # Also on "Run workflow", as in the action's README since 0.6.0. With
    # dependsOn in sluiceway.yaml, settle starts the workflow again once a
    # stack went out, and this job then starts the stacks queued behind it.
    # This repo has no dependsOn, so here it finds nothing in a few seconds.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'sluiceway'))
    runs-on: ubuntu-latest
    concurrency: sluiceway-resolve
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # No tool and no credentials in this job. It never runs the tool.
      - id: resolve
        uses: sluiceway/sluiceway@v0
        with:
          mode: resolve

  apply:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.outputs.matrix != '' && needs.resolve.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      # Stand-in for a real backend: every stack of both tools shares the one
      # state cache. Two deploys at once would restore the same state and the
      # one that saves last would drop the other's deploy. So
      # the deploys of one run go one at a time, and the concurrency group
      # below does the same across runs. A real backend locks each stack on
      # its own, and there the README's group per stack is the right one.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sluiceway-apply
      queue: max
    # The environment is only a label here: it holds no secrets. A real repo
    # keeps the credentials that change things in it.
    environment:
      name: ${{ matrix.environment }}
      deployment: false # Sluiceway already records the deploy
    env:
      # Pulumi: public on purpose, as in the scan job.
      PULUMI_CONFIG_PASSPHRASE: sluiceway-examples
    steps:
      - uses: actions/checkout@v7

      # Monorepo: the one install, as in the scan job.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Pulumi: the CLI and the providers, as in the scan job.
      - uses: pulumi/actions@v7
        with:
          pulumi-version: ^3.229.0
      - uses: actions/cache/restore@v6
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('pulumi/**/Pulumi.yaml', 'package-lock.json') }}

      # OpenTofu: the CLI and the providers, as in the scan job.
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Use a provider cache (OpenTofu)
        run: |
          mkdir -p "$RUNNER_TEMP/tofu-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/tofu-plugins" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/tofu-plugins
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('opentofu/**/.terraform.lock.hcl') }}

      # Stand-in for a real state backend, as in the scan job, with the same
      # paths for both tools.
      - name: Use the file backend (stand-in)
        # The directory has to exist: a fresh cache restores none.
        run: |
          mkdir -p "$RUNNER_TEMP/pulumi-state"
          echo "PULUMI_BACKEND_URL=file://$RUNNER_TEMP/pulumi-state" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/pulumi-state
            opentofu/**/terraform.tfstate
            opentofu/**/terraform.tfstate.d
          key: state-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.stack }}
          restore-keys: state-
      - name: Create the missing stacks (stand-in)
        run: .github/scripts/create-missing-stacks.sh

      # Secret manager: as in the scan job, with the deploy file. In a real
      # repo its references point into a vault that only the deploy's service
      # account can read, and that account's token is a secret of the
      # environment above, so only this job can use it. Install the CLI here:
      #   - uses: 1password/install-cli-action@v4
      - name: Load the environment
        # Stand-in, as in the scan job. A real repo sets here:
        #   OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_DEPLOY_TOKEN }}
        env:
          SECRET_REFERENCE: fake://
        run: .github/scripts/fake-secret-run.sh --env-file=ci/secret-manager/deploy.env -- bash .github/scripts/export-env.sh ci/secret-manager/deploy.env

      - uses: sluiceway/sluiceway@v0
        with:
          mode: apply
          deployment-id: ${{ matrix.deployment }}

      # Stand-in: save the state under a key of its own, also after a failed
      # deploy, because a deploy that stopped halfway still changed the state.
      # The next scan and the next deploy restore the newest one.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            ${{ runner.temp }}/pulumi-state
            opentofu/**/terraform.tfstate
            opentofu/**/terraform.tfstate.d
          key: state-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.stack }}

  settle:
    needs: [resolve, apply]
    if: always() && needs.resolve.outputs.matrix != '' && needs.resolve.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sluiceway/sluiceway@v0
        with:
          mode: settle
